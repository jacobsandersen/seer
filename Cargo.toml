[package]
name = "seer"
version = "1.0.0"
edition = "2021"
authors = ["Jacob Andersen <19645494+jacobsandersen@users.noreply.github.com>"]

[dependencies]
axum = { version = "0.8.9", features = ['json', 'query'] }
tower-service = "0.3.3"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
graphql_client = "0.16.0"
reqwest = { version = "0.13.3", features = ["json", "query"] }
chrono = { version = "0.4.44", features = ["serde"] }
geojson = "1.0.0"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
tokio = { version = "1.52.3", features = ["full", "tracing"] }
anyhow = "1.0.102"
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
opentelemetry = "0.32.0"
opentelemetry-appender-tracing = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic", "logs"] }
opentelemetry-http = "0.32.0"
opentelemetry-semantic-conventions = "0.32.0"
opentelemetry_sdk = { version = "0.32.0", features = ["rt-tokio", "logs"] }
validator = { version = "0.20.0", features = ["derive"] }
config = "0.15.23"
redis = { version = "1.2.1", features = ["tokio-comp", "connection-manager"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio"] }
urlencoding = "2.1.3"
regex = "1.12.3"
tower-http = { version = "0.6.11", features = ["full"] }
